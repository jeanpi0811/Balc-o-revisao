name: Build FarmaBolsoPro

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FarmaBolso-revisado

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PNPM (tu usa pnpm-lock.yaml)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        run: pnpm install

      - name: Build (Expo / Web)
        run: pnpm run build || echo "No web build script"

      # ANDROID (Capacitor/Expo)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prebuild Android (Expo)
        run: npx expo prebuild --platform android --no-install || echo "Already built"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: FarmaBolso-revisado/android/app/build/outputs/apk/debug/app-debug.apk
